# SonarCloud project settings. A CI-based scan reads this file: the shared runner
# (rios0rios0/pipelines, `global/scripts/tools/sonarqube/run.sh`) appends `sonar.projectKey`,
# `sonar.projectName`, `sonar.projectVersion` and the coverage report paths to it before calling
# `sonar-scanner`, so keep it to plain key=value lines it can append to.
#
# NOTE: this repository is analyzed by SonarCloud Automatic Analysis today -- the CI job
# `management > report:sonarqube` is skipped because `.github/workflows/default.yaml` passes no
# `sonar_host`, and Automatic Analysis ignores `sonar-project.properties`. The block below is the
# in-repo record of the decision and becomes effective as soon as the CI-based scan is enabled;
# until then the same two rules have to be accepted in the SonarCloud project settings
# (Analysis Scope > Ignore Issues) or on the four issues themselves.
#
# Accepted findings. go:S4830 (server certificate validation) and go:S5527 (hostname verification)
# flag the only two places that build a transport with `InsecureSkipVerify: true`. Both run solely
# when the user opts in through the documented `ignore_tls` option (self-signed certificates, local
# testing), which defaults to `false` and is never enabled implicitly; skipping verification IS the
# feature, so the finding cannot be fixed without removing it. The transports keep
# `MinVersion: tls.VersionTLS13` and a warning is logged whenever verification is skipped.
#
# Scope caveat. `sonar.issue.ignore.multicriteria` has no line granularity, so a criterion is only as
# narrow as the file it names. e1/e2 are exact -- `internal_context.go` is 30 lines and holds nothing
# else. e3/e4 are not: `resource_http_request.go` is ~2400 lines, so they also silence go:S4830 and
# go:S5527 for any transport a later change adds to that file. What still catches such a site is
# gosec G402 through `make lint`: the `//nolint:gosec` next to each accepted `InsecureSkipVerify:
# true` is line-scoped, so a new one has to be waived explicitly, in the diff, to reach CI green.
# Narrowing e3/e4 means moving `resolveIgnoreTLS`/`resolveInsecureTransport` into a file of their
# own. Do that only once this acceptance is in force (CI-based analysis enabled, or the rules
# accepted in the SonarCloud project settings): it was attempted here and reverted, because the
# moved lines re-enter the new-code period as fresh code and the findings reappear there while the
# acceptance is not yet applied -- the PR gate went to ERROR with `new_security_rating` = D.
sonar.issue.ignore.multicriteria=e1,e2,e3,e4
sonar.issue.ignore.multicriteria.e1.ruleKey=go:S4830
sonar.issue.ignore.multicriteria.e1.resourceKey=internal/domain/entities/internal_context.go
sonar.issue.ignore.multicriteria.e2.ruleKey=go:S5527
sonar.issue.ignore.multicriteria.e2.resourceKey=internal/domain/entities/internal_context.go
sonar.issue.ignore.multicriteria.e3.ruleKey=go:S4830
sonar.issue.ignore.multicriteria.e3.resourceKey=internal/provider/resource_http_request.go
sonar.issue.ignore.multicriteria.e4.ruleKey=go:S5527
sonar.issue.ignore.multicriteria.e4.resourceKey=internal/provider/resource_http_request.go
