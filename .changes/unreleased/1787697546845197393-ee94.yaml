kind: 'Fixed'
body: 'removed the two stale items from the bump pull request template that asked for a `version` constant in `main.go` and a `VERSION` variable in the `Makefile` to be hand-edited. The provider version is injected at build time through `-ldflags` — GoReleaser passes the tag and the `Makefile` derives it from `git describe` — so `main.go` deliberately stays at `"dev"` and editing either by hand would have been wrong.'
