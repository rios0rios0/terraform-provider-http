kind: 'Added'
body: 'added it because the combination is a trap that is invisible until it fires, and then self-perpetuating. `delete_headers` is write-only and Terraform sends no configuration to a destroy (`resource.DeleteRequest` has no `Config` field, unlike `UpdateRequest`), so it is captured into private state at create/update and replayed on destroy -- where `makeDeleteModel` puts it exactly where a resource''s own headers go, and `buildRequest` applies those AFTER the provider''s. The resource value therefore wins. Fine for a header that describes the request; a trap for a credential, because rotating it means the destroy is sent with the value captured when the resource was created. If the endpoint rejects it the destroy fails, and when that destroy is the first half of a replacement -- which `headers` forces, being `RequiresReplace` as a whole map -- the replacement never completes, so state keeps the OLD value and every later plan proposes the same thing. No configuration edit reaches it, because the state write that would fix it is the one the failure prevents'
